# Experiment H4a — distil your Hindi 24-layer teacher (H3) into a 6-layer student
# (~110M with the codec), baking in guidance (cfg 2) — the official recipe.

teacher:
  config: checkpoints/pocket-hindi-teacher-24l/step_0050000/config.yaml   # pick your best checkpoint
  weights: config
  dtype: bfloat16

student:
  config: checkpoints/pocket-hindi-teacher-24l/step_0050000/config.yaml
  overrides:
    flow_lm.transformer.num_layers: 6

distill:
  cfg_coef: 2.0

data:
  train: data/pocket_latents/hindi_train/manifest.jsonl
  valid: data/pocket_latents/hindi_valid/manifest.jsonl
  tokenizer_path: data/hindi_tokenizer.model
  normalize_text: hindi

optim:
  lr: 4.0e-4
  warmup_steps: 1000

train:
  batch_size: 32
  grad_accum: 2
  max_steps: 200000          # WER parity ~50k; similarity / UTMOS keep improving to ~150k
  run_dir: checkpoints/pocket-hindi-6l
