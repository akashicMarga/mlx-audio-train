# Experiment H3' — 24-layer Hindi teacher FROM SCRATCH (the Saryps Labs recipe: 400k
# steps on 932 h). Only the Mimi codec comes from Kyutai. Weeks on one Mac — H3 is
# the practical route; this is here for completeness / multi-machine runs.

model:
  config: configs/pocket_tts/models/english_2026-09_24l.yaml
  overrides:
    flow_lm.lookup_table.tokenizer: sentencepiece
    flow_lm.lookup_table.tokenizer_path: data/hindi_tokenizer.model
  weights: null
  mimi_weights: hf://kyutai/pocket-tts/languages/english_2026-09_24l/model.safetensors@983151f13aaeab1b13c1e5e3c2c383d49a9edf3f

loss:
  flow_batch_multiplier: 4
  eos_loss_weight: 0.1
  text_dropout: 0.2
  voice_dropout: 0.2

stats_ema_steps: 1000

data:
  train: data/pocket_latents/hindi_train/manifest.jsonl
  valid: data/pocket_latents/hindi_valid/manifest.jsonl
  tokenizer_path: data/hindi_tokenizer.model
  normalize_text: hindi

optim:
  lr: 2.0e-4
  schedule: cosine             # never decay to zero before ~200k (upstream notes)
  warmup_steps: 1000

train:
  batch_size: 16
  grad_accum: 4
  max_steps: 400000
  ema_decay: 0.999
  run_dir: checkpoints/pocket-hindi-teacher-24l-scratch
