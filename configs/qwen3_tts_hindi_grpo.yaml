# ─────────────────────────────────────────────────────────────────────────────
# Qwen3-TTS 0.6B — Hindi GRPO Post-Training (Pipeline 3)
# Runs AFTER SFT (configs/qwen3_tts_hindi.yaml). Refines the SFT adapter with
# RL on a direct intelligibility reward (1 − CER). See docs/grpo_post_training.md.
# ─────────────────────────────────────────────────────────────────────────────

pipeline: grpo            # dispatch GRPOTrainer in scripts/train.py

model:
  model_id: "mlx-community/Qwen3-TTS-12Hz-0.6B-Base-8bit"
  tokenizer_id: "Qwen/Qwen3-TTS-Tokenizer-12Hz"
  model_type: "qwen3_tts"
  custom_lang_ids:
    hi: 2051

lora:
  rank: 8
  alpha: 16.0
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  # GRPO only needs prompt TEXT (codec labels are unused unless sft_lambda>0).
  # Reuse the SFT jsonl; the loader extracts text per sample.
  train_jsonl: "./data/hindi/train_codes.jsonl"
  target_sr: 24000
  max_samples: null

grpo:
  # Resume the SFT adapter — this becomes BOTH the initial policy AND (snapshotted
  # at start) the frozen KL reference. Required: GRPO should refine SFT, not base.
  init_adapters: "./checkpoints/qwen3-hindi/checkpoint-best/adapters.safetensors"

  group_size:      4          # G rollouts per prompt
  prompts_per_step: 4         # B → 16 rollouts/step (maps to grad_accumulation)
  max_new_tokens:  240        # ~20s at 12Hz; match dataset durations
  temperature:     0.9
  top_p:           0.95
  top_k:           50

  # Loss terms (see train/losses/grpo_loss.py)
  kl_beta:        0.05        # KL(π_θ ‖ π_ref_SFT) weight (k3 estimator)
  kl_clip:        10.0        # clamp |logπ_ref − logπ_θ| before exp (k3 stability)
  sub_pg_weight:  0.0         # advantage-weight the code_predictor head too (0 = off)
  pg_norm:        token       # token = Σ/Σtokens (length-weighted; GRPO default) |
                              # sequence = mean of per-rollout means (length-neutral, Dr.GRPO/DAPO)
  adv_norm:       std         # std = (r−mean)/std (DeepSeek default) | none = r−mean (Dr. GRPO).
                              # KEEP std: the 2×2 ablation (see docs) showed drop-std diverges
                              # (late KL cliff) at both 8× and 3× LR with no CER win.
  sft_lambda:     0.1         # optional CE anchor on real SFT batches (0 = off)
  skip_zero_variance: true    # drop groups where all rollouts get the same reward (no PG signal)

  rewards:
    intelligibility:
      weight:    1.0
      asr_model: "mlx-community/whisper-large-v3-turbo"
      metric:    cer          # CER > WER for Devanagari robustness
      language:  hi
      reward_shape: tanh      # 1 − tanh(k·CER): ~2.6× wider within-group spread at
      reward_k:     3         # CER≈0.12 vs linear. 2×2 ablation: 0.081→0.078 CER at
                              # lower KL, fully stable. (linear = 1 − min(1,CER))
    length_penalty:
      weight:        0.5
      no_eos_penalty:  1.0     # hit max_new_tokens without EOS
      silence_penalty: 0.5     # excessive trailing silence (degeneracy guard)
      # Anti reward-hacking: penalise voiced speech slower than min_cps chars/sec
      # (over-enunciation that keeps CER low). 0 = off; ~8–10 is a sane Hindi floor.
      speaking_rate_min_cps: 0.0
      speaking_rate_penalty: 0.5
      # Graded over-length guard: dense gradient the binary no_eos_penalty cliff
      # lacks. Penalise voiced speech beyond tol×expected (expected = chars /
      # target_cps), ramping to overrun_penalty at 2×tol×expected. 0 = off;
      # ~13–15 is a natural Hindi rate. Set no_eos_penalty: 0 to fully replace
      # the cliff with this graded term.
      length_target_cps:  0.0
      length_overrun_tol: 1.5
      overrun_penalty:    0.5
    # speaker_similarity:      # Pipeline 2 only (needs include_ref_mel + ref audio)
    #   weight: 1.0
    # naturalness:             # DNSMOS quality term — the lever beyond CER-only.
    #   weight: 0.5            #   needs `pip install speechmos onnxruntime`. 0/absent = off.
    #   metric: ovrl           #   ovrl | sig | bak (DNSMOS P.835 sub-score)

  # In-loop held-out eval (TensorBoard only): every trainer.eval_every_n_steps,
  # roll out a FIXED prompt set with a fixed seed and log cer / duration_s /
  # trailing_silence / kl (+ a sample waveform). Makes a run self-documenting.
  eval:
    num_prompts: 8            # how many fixed prompts to score
    group_size:  2            # rollouts per prompt (averaged)
    # jsonl: "./data/hindi/heldout.jsonl"   # optional: a TRULY held-out set;
    #                                       # omitted → first num_prompts of train

trainer:
  output_dir: "./checkpoints/qwen3-hindi-grpo"
  run_name:   "qwen3-0.6b-hindi-grpo"
  lang_code:  "hi"

  num_epochs: 100             # cycles over prompts; real bound is max_steps
  max_steps:  300
  grad_accumulation: 4        # == prompts_per_step (B); one step = one rollout batch (on-policy)

  learning_rate: 5.0e-6       # ~4x lower than SFT — RL is noisy
  weight_decay:  0.01
  grad_clip:     1.0
  warmup_steps:  10
  lr_schedule:   "constant"   # short RL run; cosine optional

  log_every_n_steps:  1
  save_every_n_steps: 50
  eval_every_n_steps: 25      # in-loop fixed-prompt eval cadence (needs tensorboard_dir)
  save_every_n_epochs: 999999

  # tensorboard_dir: "/tmp/tb/qwen3-hindi-grpo"   # reward_mean/cer_mean/kl + grpo_eval/* + train/skip_ratio
