# ─────────────────────────────────────────────────────────────────────────────
# LFM 2.5 Audio — ASR full dataset run (49,909 samples, ~3 epochs, rank 16)
# Compare against lfm_audio_asr_10k.yaml which used only 950 samples.
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_id: "mlx-community/LFM2.5-Audio-1.5B-8bit"
  model_type: "lfm_audio"

lora:
  rank: 16
  alpha: 32.0
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_jsonl: "./data/ohf_voice/train.jsonl"
  val_jsonl:   "./data/ohf_voice/val.jsonl"
  target_sr:    24000
  min_duration: 0.5
  max_duration: 20.0
  normalize: true
  trim: true
  # no max_samples — use all 49,909

trainer:
  output_dir: "./checkpoints/lfm-audio-asr-50k"
  run_name:   "lfm2.5-asr-50k"

  num_epochs: 5
  max_steps:  20000        # ~3 epochs over 49,909 samples (effective batch 8)

  batch_size: 1
  grad_accumulation: 8

  learning_rate: 5.0e-5
  weight_decay:  0.01
  grad_clip:     1.0

  warmup_steps:  500
  lr_schedule:   "cosine"

  save_every_n_steps:  2000
  save_every_n_epochs: 999
  keep_last_n:         3

  eval_every_n_steps:  1000
  val_batches:         20

  log_every_n_steps:   100
  log_file: "./checkpoints/lfm-audio-asr-50k/train_log.jsonl"

  sort_by_length: true
  prefetch:       2

  label_smoothing: 0.0

processor:
  max_text_len:    512
  max_audio_frames: 512
  training_mode:   "asr"
  system_prompt:   "Perform ASR."
