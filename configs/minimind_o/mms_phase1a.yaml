# MiniMind-O — Phase 1a: MMS-300m encoder, projector-only training
#
# Audio encoder: facebook/mms-300m (1000+ languages including all major Indic)
# Trains ONLY the audio projector (~1.2M params). Everything else frozen.
# This is the fastest way to add multilingual audio understanding.
#
# What changes vs baseline:
#   audio_encoder_type: mms-300m    ← 1024d output instead of 512d
#   mode: audio_proj                ← only projector trains
#   freeze_backbone: all            ← Thinker frozen
#   freeze_talker: true             ← Talker frozen
#
# Run:
#   python scripts/minimind_o_train.py --config configs/minimind_o/mms_phase1a.yaml
#
# Expected training time: ~100-500 steps, minutes on M2 Max
# Expected data size: 1K+ samples sufficient for projector alignment

model:
  audio_encoder_type: mms-300m
  audio_encoder_path: facebook/mms-300m
  # audio_hidden_size: 1024  ← auto-resolved, projector in_dim will be 1024

  hidden_size: 768
  num_hidden_layers: 8
  num_talker_hidden_layers: 4
  talker_hidden_size: 768
  num_attention_heads: 8
  num_key_value_heads: 4

training:
  # Phase 1a: train only the audio projector
  mode: audio_proj
  freeze_backbone: all
  freeze_talker: true

  epochs: 5
  batch_size: 4
  grad_accumulation: 4            # effective batch = 16
  learning_rate: 5.0e-4
  grad_clip: 1.0
  max_seq_len: 512
  scheduled_sampling: 0.05

  data_path: ./data/indic_train.parquet
  tokenizer_path: ""
  num_workers: 2

  save_dir: ./out/minimind_o_mms_phase1a
  save_weight: sft_omni_mms_proj
  log_interval: 25
  save_interval: 200
